  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Prince Limousine customer booking app">

  <title>Prince Limousine</title>
  <link rel="manifest" href="manifest.json">

  <script src="maps_config.js"></script>
  <script>
    (function loadGoogleMapsApi() {
      const params = new URLSearchParams(window.location.search);
      const apiKey = window.GOOGLE_MAPS_API_KEY || params.get('googleMapsApiKey');

      if (!apiKey) {
        console.error(
          'Google Maps JavaScript API key is missing. Set window.GOOGLE_MAPS_API_KEY in web/maps_config.js or pass ?googleMapsApiKey=YOUR_KEY for local testing.'
        );
        return;
      }

      document.write(
        '<script src="https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(apiKey) +
          '"><\/script>'
      );
    }());
  </script>
</head>
